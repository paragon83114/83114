# =============================================================================
# GENERAL
# =============================================================================

unbind C-b
unbind C-q
set -g prefix C-q
bind C-q send-prefix
set -g escape-time 0
set -g mouse on
set -g repeat-time 1000
set -g history-limit 1000
set -g renumber-windows on
#setw -g aggressive-resize on

# =============================================================================
# INDEXACIÓN
# =============================================================================

set -g base-index 1
set -g pane-base-index 1

# =============================================================================
# TERMINAL Y COLORES
# =============================================================================

set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -s terminal-overrides '*:RGB:U8=0'

# =============================================================================
# BARRA DE ESTADO (DISEÑO UNIFICADO Y MINIMALISTA V2)
# =============================================================================

# Estilo general con base Catppuccin Mocha
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left ""
set -g status-justify left
set -g status-right-length 140

# --- PESTAÑAS (WINDOWS) ---
# Ventana Inactiva: Icono moderno de shell  + Texto gris atenuado (Separación por espacios)
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I:  #W "

# Ventana Activa: Bloque de alto contraste (Texto oscuro sobre fondo azul sapphire) con cierre angular 
set -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:  #W #[fg=#89b4fa,bg=#1e1e2e,nobold]"

# Quitamos el separador de ventanas rígido vertical
set -g window-status-separator ""

# --- SECCIÓN CENTRAL Y DERECHA (SIN SEPARADORES VERTICALES) ---
# Centro: SSH y OLLAMA usan un espacio amplio elegante en lugar de barras rígidas.
# Derecha: Se encadenan los módulos con consistencia en iconos lineales (󰍛 RAM, 󰩟 IP, 󰸗 Fecha, 󱎫 Hora) y transiciones .
set -g status-right "#[align=centre]#[bg=#1e1e2e]#{?#{==:#(pgrep -x sshd >/dev/null && printf 1 || printf 0),1},#[fg=#a6e3a1]󰒍 SSH,#[fg=#585b70]󰒍 SSH}    #{?#{==:#(ps -ef | grep '[o]llama serve' >/dev/null && printf 1 || printf 0),1},#[fg=#fab387]󱐌 OLLAMA,#[fg=#585b70]󱐌 OLLAMA} #[align=right]#[fg=#89b4fa]󰍛 #[fg=#cdd6f4]#(free -h | awk '/Mem/{print $3}')  #[fg=#89b4fa]󰇮 #[fg=#cdd6f4]#(gmail-check)  #[fg=#89b4fa]󰩟 #[fg=#cdd6f4]#(ifconfig 2>&1 | grep -A3 wlan0 | awk '/inet /{print $2}') #[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] 󰸗 %d %b #[fg=#45475a,bg=#313244]#[fg=#cdd6f4,bg=#45475a] 󱎫 %H:%M "

# =============================================================================
# BORDES DE PANEL
# =============================================================================

set -g pane-border-lines single
set -g pane-border-style "fg=#313244"        # Línea sutil acorde al fondo general
set -g pane-active-border-style "fg=#89b4fa" # El panel activo brilla en azul sapphire igual que la pestaña activa

# =============================================================================
# ESTILO DE POPUPS (PROPIO DE NUESTRO TEMA)
# =============================================================================

# Define el tipo de línea del borde (rounded = esquinas redondeadas muy elegantes si tu terminal las soporta)
set -g popup-border-lines rounded

# Color del borde del popup: Azul Sapphire a juego con el sistema
set -g popup-border-style "fg=#89b4fa,bg=#11111b"

# Color del contenido interior del popup: Fondo base oscuro para dar efecto de superposición (Mantle/Crust)
set -g popup-style "fg=#cdd6f4,bg=#11111b"

# =============================================================================
# NAVEGACIÓN ENTRE PANELES — Alt + Flechas
# =============================================================================

bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

bind -n M-Left previous-window
bind -n M-Right next-window

# =============================================================================
# CREACIÓN DE PANELES Y POPUPS — Alt + Shift + Flechas / Alt + Space
# =============================================================================

bind -n M-S-Left split-window -h -b -l 33%
bind -n M-S-Right split-window -h -l 33%
bind -n M-S-Up split-window -v -b -l 33%
bind -n M-S-Down split-window -v -l 33%

# Popup adaptado: Ahora hereda el diseño limpio automáticamente
bind -n M-Space display-popup -w 80% -h 80% -d "#{pane_current_path}"

# =============================================================================
# NAVEGACIÓN ENTRE VENTANAS — Alt + N
# =============================================================================

bind -n M-1 if-shell "tmux select-window -t :1" "" "new-window -t :1"
bind -n M-2 if-shell "tmux select-window -t :2" "" "new-window -t :2"
bind -n M-3 if-shell "tmux select-window -t :3" "" "new-window -t :3"
bind -n M-4 if-shell "tmux select-window -t :4" "" "new-window -t :4"
bind -n M-5 if-shell "tmux select-window -t :5" "" "new-window -t :5"
bind -n M-6 if-shell "tmux select-window -t :6" "" "new-window -t :6"
bind -n M-7 if-shell "tmux select-window -t :7" "" "new-window -t :7"
bind -n M-8 if-shell "tmux select-window -t :8" "" "new-window -t :8"
bind -n M-9 if-shell "tmux select-window -t :9" "" "new-window -t :9"

# =============================================================================
# ATAJOS RÁPIDOS
# =============================================================================

bind -n M-x kill-pane
bind -n M-e copy-mode
bind -n M-w choose-window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# =============================================================================
# MODO COPIA (VI)
# =============================================================================

set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
