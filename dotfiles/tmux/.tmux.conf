unbind C-b
unbind C-q
set -g prefix C-q
bind C-q send-prefix
set -g escape-time 0
set -g mouse on
set -g repeat-time 1000
set -g history-limit 10000
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -s terminal-overrides '*:RGB:U8=0'
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left ""
set -g status-justify left
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I:  #W "
set -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:  #W #[fg=#89b4fa,bg=#1e1e2e,nobold]"
set -g window-status-separator ""
set -g status-right "#[align=right]#[fg=#89b4fa]#[fg=#cdd6f4]#(free -h | awk '/Mem/{print $3}')  #[fg=#89b4fa]%d %b #[fg=#45475a,bg=#313244]#[fg=#cdd6f4,bg=#45475a] %H:%M "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#89b4fa,bg=#11111b"
set -g popup-style "fg=#cdd6f4,bg=#11111b"
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-S-Left split-window -h -b -l 33%
bind -n M-S-Right split-window -h -l 33%
bind -n M-S-Up split-window -v -b -l 33%
bind -n M-S-Down split-window -v -l 33%
bind -n M-Space display-popup -w 80% -h 80% -d "#{pane_current_path}"
bind -n M-1 if-shell "tmux select-window -t :1" "" "new-window -t :1"
bind -n M-2 if-shell "tmux select-window -t :2" "" "new-window -t :2"
bind -n M-3 if-shell "tmux select-window -t :3" "" "new-window -t :3"
bind -n M-x kill-pane
bind -n M-e copy-mode
bind -n M-w choose-window
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
